apply plugin: 'com.android.application'
apply plugin: 'realm-android'

// The backend's MEDIA_URL, e.g. https://<bucket>.s3.amazonaws.com. Set
// tapt.mediaUrl in ~/.gradle/gradle.properties or pass -Ptapt.mediaUrl=...
def mediaUrl = (findProperty('tapt.mediaUrl') ?: '').toString().replaceAll('/+$', '')
if (!mediaUrl) {
    logger.warn("tapt.mediaUrl is not set; images and videos will not load.")
    mediaUrl = 'https://tapt-media-url-not-set.invalid'
}

android {
    namespace 'com.linute.linute'
    compileSdk 35

    defaultConfig {
        applicationId "com.linute.linute"
        minSdk 24
        targetSdk 35
        versionCode 43
        versionName "1.7.7.1"
        multiDexEnabled true
        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"

        // Backend. Override any of these in ~/.gradle/gradle.properties or with
        // -Ptapt.apiHost=... to point a build at a local server.
        buildConfigField "String", "API_SCHEME", "\"${findProperty('tapt.apiScheme') ?: 'https'}\""
        buildConfigField "String", "API_HOST_LIVE", "\"${findProperty('tapt.apiHost') ?: 'api.tapt.mafz.al'}\""
        buildConfigField "String", "API_HOST_DEV", "\"${findProperty('tapt.apiHostDev') ?: findProperty('tapt.apiHost') ?: 'api.tapt.mafz.al'}\""
        buildConfigField "String", "API_VERSION", "\"${findProperty('tapt.apiVersion') ?: 'v1.4.8'}\""
        // Base of every media URL (the backend's MEDIA_URL), no trailing slash.
        buildConfigField "String", "MEDIA_URL", "\"${mediaUrl}\""
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}



dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.12'
    implementation('io.socket:socket.io-client:2.1.2') {
        exclude group: 'org.json', module: 'json'
    }

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:3.4.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.github.bumptech.glide:glide:3.7.0'
    implementation 'com.facebook.android:facebook-android-sdk:4.9.0'
    implementation 'com.makeramen:roundedimageview:2.2.1'
    implementation 'com.linkedin.android.spyglass:spyglass:1.3.0'
    implementation 'de.hdodenhof:circleimageview:2.1.0'
    implementation 'com.daimajia.swipelayout:library:1.2.0@aar'
    //    implementation 'com.github.hiteshsondhi88.libffmpeg:FFmpegAndroid:0.2.5'
    implementation 'com.writingminds:FFmpegAndroid:0.3.2'
    implementation 'commons-io:commons-io:2.4'
    implementation 'com.lyft:scissors:1.1.1'
    implementation 'io.reactivex:rxandroid:1.1.0'
    implementation 'io.reactivex:rxjava:1.1.0'
    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-base:18.5.0'
    implementation 'com.getbase:floatingactionbutton:1.10.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    //new
    // org.bson.types.ObjectId comes from the bson jar that Realm 10 pulls in.
    implementation 'org.mongodb:bson:3.12.1'
    implementation 'com.github.lzyzsd:CircleProgress:v1.2.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
}

// app/google-services.json is not committed (see SETUP.md). Without it the
// build still works, Firebase is never initialised and push is disabled.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn("app/google-services.json is missing; push notifications are disabled.")
}

